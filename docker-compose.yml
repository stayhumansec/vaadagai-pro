services:
  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      DB_PATH: /app/data/vaadagai.db
      UPLOAD_PATH: /app/uploads/
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      BACKUP_EMAIL_TO: ${BACKUP_EMAIL_TO}
      BACKUP_CRON: ${BACKUP_CRON}
    volumes:
      - vaadagai-data:/app/data
      - vaadagai-uploads:/app/uploads
    restart: unless-stopped

volumes:
  vaadagai-data:
  vaadagai-uploads:
